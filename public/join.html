<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Set up · The Wanderers' Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"]{--bg:#fff;--surface:#fff;--surface-2:#F5F3EF;--text:#141210;--text-2:#6B6156;--line:#E9E4DC;--ember:#C0603F;--shadow:rgba(40,30,20,.14);}
  :root[data-theme="dark"]{--bg:#141210;--surface:#1E1A16;--surface-2:#26211B;--text:#F0E7D9;--text-2:#9E9284;--line:#332C24;--ember:#D3714E;--shadow:rgba(0,0,0,.5);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding:max(28px,env(safe-area-inset-top)) 22px;}
  .wrap{max-width:440px;margin:0 auto;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);text-decoration:none;font-size:14px;font-weight:500;margin-bottom:26px;}
  h1{font-size:26px;font-weight:700;margin-bottom:6px;}
  .sub{color:var(--text-2);font-size:14px;margin-bottom:28px;}
  .idrow{display:flex;gap:16px;align-items:center;margin-bottom:22px;}
  .avatar{width:76px;height:76px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:30px;font-weight:300;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .field{flex:1;}
  label{display:block;font-size:12px;color:var(--text-2);font-weight:600;margin-bottom:7px;letter-spacing:.02em;}
  input[type=text]{width:100%;font:inherit;font-size:16px;font-weight:500;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
  input[type=text]:focus{outline:none;border-color:var(--ember);}
  .block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
  .block h3{font-size:15px;font-weight:600;margin-bottom:4px;}
  .block p{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:14px;}
  .circle-state{font-size:14px;margin-bottom:12px;}
  .code{display:inline-block;font-weight:700;letter-spacing:.14em;color:var(--ember);background:var(--surface-2);border-radius:8px;padding:4px 12px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;}
  .chip.primary{background:var(--ember);color:#fff;border-color:var(--ember);}
  .save{width:100%;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--ember);border:none;border-radius:14px;padding:16px;cursor:pointer;margin-top:8px;box-shadow:0 6px 20px rgba(192,96,63,.35);}
  .save:active{transform:scale(.98);}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Back to map</a>
    <h1>Your profile</h1>
    <p class="sub">This is how friends see you on the map.</p>

    <div class="idrow">
      <button class="avatar" id="avatar"><span id="ini">+</span><img id="avimg" style="display:none" alt=""></button>
      <div class="field">
        <label>Name</label>
        <input id="name" type="text" placeholder="e.g. Farxod" maxlength="20">
      </div>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none">

    <div class="block">
      <label style="margin-bottom:7px">Status (optional)</label>
      <input id="status" type="text" placeholder="e.g. at ZIYOKOR" maxlength="40">
    </div>

    <div class="block">
      <h3>Private circle</h3>
      <p>You’re visible only to people who share your circle code. Share it with whoever you want to see you.</p>
      <div class="circle-state" id="circleState"></div>
      <div class="row">
        <button class="chip" id="joinC">Join with a code</button>
        <button class="chip" id="newC">Create a circle</button>
        <button class="chip" id="leaveC" style="display:none">Leave</button>
      </div>
    </div>

    <button class="save" id="save">Save & open map</button>
  </div>
<script>
(function(){
  "use strict";
  const root=document.documentElement;
  const t=localStorage.getItem('wm_theme'); if(t) root.setAttribute('data-theme',t);

  const nameEl=document.getElementById('name'), statusEl=document.getElementById('status');
  const avatar=document.getElementById('avatar'), file=document.getElementById('file'), avimg=document.getElementById('avimg'), ini=document.getElementById('ini');
  nameEl.value=localStorage.getItem('wm_name')||'';
  statusEl.value=localStorage.getItem('wm_status')||'';
  let photo=localStorage.getItem('wm_photo')||'';
  let circle=localStorage.getItem('wm_circle')||'';

  function showAv(){ if(photo){avimg.src=photo;avimg.style.display='block';ini.style.display='none';} else {ini.textContent=nameEl.value.trim()?nameEl.value.trim()[0].toUpperCase():'+';ini.style.display='block';avimg.style.display='none';} }
  nameEl.oninput=showAv; showAv();
  avatar.onclick=()=>file.click();
  file.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const S=96,cv=document.createElement('canvas');cv.width=S;cv.height=S;const x=cv.getContext('2d');const side=Math.min(img.width,img.height);x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);photo=cv.toDataURL('image/jpeg',0.7);showAv(); }; img.src=rd.result; }; rd.readAsDataURL(f); };

  function makeCode(){ const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s; }
  function renderCircle(){
    const el=document.getElementById('circleState'), leave=document.getElementById('leaveC');
    if(circle){ el.innerHTML=`In circle <span class="code">${circle}</span> — share this code with people you want to see you.`; leave.style.display=''; }
    else { el.innerHTML=`<span style="color:var(--text-2)">Not in a circle — you’re on the open map, visible to anyone with the link.</span>`; leave.style.display='none'; }
  }
  document.getElementById('newC').onclick=()=>{ circle=makeCode(); renderCircle(); const msg=`Join me on the Wanderers' Map: ${location.origin}/join.html and enter circle code ${circle}`; if(navigator.share)navigator.share({text:msg}).catch(()=>{}); else if(navigator.clipboard)navigator.clipboard.writeText(circle); };
  document.getElementById('joinC').onclick=()=>{ const c=prompt('Enter the circle code you were given:'); if(c&&c.trim()){ circle=c.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10); renderCircle(); } };
  document.getElementById('leaveC').onclick=()=>{ if(confirm('Leave this circle?')){ circle=''; renderCircle(); } };
  const urlC=new URLSearchParams(location.search).get('circles'); if(urlC){ circle=urlC.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10); }
  renderCircle();

  document.getElementById('save').onclick=async ()=>{
    const name=nameEl.value.trim(); if(!name){ nameEl.focus(); return; }
    localStorage.setItem('wm_name',name);
    localStorage.setItem('wm_status',statusEl.value.trim());
    localStorage.setItem('wm_photo',photo);
    localStorage.setItem('wm_circle',circle);
    let id=localStorage.getItem('wm_id'); if(!id){id='w-'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('wm_id',id);}
    try{ await fetch('/profile/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,photo:photo||null,status:statusEl.value.trim()})}); }catch(_){}
    location.href = circle ? ('/?circles='+encodeURIComponent(circle)) : '/';
  };
})();
</script>
</body>
</html>
