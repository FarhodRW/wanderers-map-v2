name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Point Bubblewrap at preinstalled JDK + SDK
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$HOME/.bubblewrap"
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' "$JAVA_HOME" "$SDK_PATH" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/android.keystore"

      - name: Prepare project dir with our twa-manifest.json
        run: |
          mkdir -p twa
          # write the signing key location into the manifest (absolute path — relative fails)
          node -e '
            const fs=require("fs");
            const m=JSON.parse(fs.readFileSync("twa-manifest.json","utf8"));
            m.signingKey={path:process.env.HOME+"/android.keystore",alias:"wanderers"};
            fs.writeFileSync("twa/twa-manifest.json",JSON.stringify(m,null,2));
            console.log("wrote twa/twa-manifest.json with signingKey");
          '
          cat twa/twa-manifest.json

      - name: Build & sign APK (regenerate project from manifest, then build)
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Pipe "yes" into every prompt (regenerate? Y). 'yes' streams y-newline
          # forever so any confirmation is auto-accepted; the build itself is
          # driven by twa-manifest.json + the env-var keystore passwords.
          echo "== update =="
          yes | bubblewrap update --manifest="./twa-manifest.json"
          echo "---- files after update ----"; ls -la
          echo "== build =="
          yes | bubblewrap build --skipPwaValidation --manifest="./twa-manifest.json"
          echo "---- outputs ----"; ls -la *.apk *.aab 2>/dev/null || echo "NO APK PRODUCED"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanderers-apk
          path: |
            twa/*.apk
            twa/*.aab
          if-no-files-found: error
