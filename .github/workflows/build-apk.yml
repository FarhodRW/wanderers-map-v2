name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/android.keystore"

      - name: Init TWA project (non-interactive)
        env:
          # point Bubblewrap at the tools already installed above so it never
          # prompts to download them
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p twa && cd twa
          # feed newlines/defaults to any residual prompts
          yes "" | bubblewrap init \
            --manifest="https://wanderers-map-v2.onrender.com/manifest.webmanifest" \
            --directory="." || true
          echo "---- files after init ----"; ls -la

      - name: Build & sign APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes "" | bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="$HOME/android.keystore" \
            --signingKeyAlias="wanderers" || true
          echo "---- outputs ----"; ls -la *.apk *.aab 2>/dev/null || echo "none found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanderers-apk
          path: |
            twa/*.apk
            twa/*.aab
          if-no-files-found: warn
